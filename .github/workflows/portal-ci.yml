name: Portal CI

on:
  push:
    branches:
      - main
    paths:
      - frontend-portal/**
      - .github/workflows/portal-ci.yml
  pull_request:
    paths:
      - frontend-portal/**
      - .github/workflows/portal-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-portal/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build standalone output
        run: pnpm build

      - name: Check standalone preparation script
        run: node --check scripts/prepare-standalone.mjs

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.mjs

      - name: Build container without publishing
        run: docker build --file Dockerfile --tag frontend-portal:ci .
